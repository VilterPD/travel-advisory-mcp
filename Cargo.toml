[package]
name = "travel-advisory-mcp"
version = "0.1.0"
edition = "2021"
description = "Minimal feasibility prototype MCP server for German Foreign Office travel advisories."

[dependencies]
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "0.6.4", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "signal"] }
